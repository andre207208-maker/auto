name: Deploy AUTOBLOGGER AI Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Typecheck, Test, Migrate D1 & Deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Validate Wrangler configuration & bundle
        run: npx wrangler deploy --dry-run

      - name: Apply D1 remote migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing Cloudflare API Token"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare Account ID"
            exit 1
          fi
          if grep -q '"00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error file=backend/wrangler.jsonc,line=31::Placeholder D1 database_id detected. Replace 00000000-0000-0000-0000-000000000000 with your real Cloudflare D1 UUID for autoblogger-db."
            exit 1
          fi
          npx wrangler d1 migrations apply autoblogger-db --remote

      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
